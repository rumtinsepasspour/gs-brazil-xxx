<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow, noarchive">
<meta name="referrer" content="no-referrer">
<meta name="color-scheme" content="light">
<title>Germany monitor</title>
<style>
:root {
  color-scheme: light;
  --bg: #f7f3ec;
  --band: #ede9e0;
  --ink: #16242a;
  --muted: #5c6b70;
  --rule: #d9d4ca;
  --accent: #0e5a6b;
  --high: #a3264d;
  --medium: #e0a030;
  --low: #c3cbca;
  --pill: #e4dfd6;
}
* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--ink);
  font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
}
.page { max-width: 110rem; margin: 0 auto; padding: 1.75rem 1.5rem 4rem; }

.masthead { display: flex; flex-wrap: wrap; align-items: baseline; gap: .25rem 1.25rem; margin-bottom: 1.25rem; }
.masthead h1 { margin: 0; font: 600 1.75rem/1.2 Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif; }
.masthead p { margin: 0; color: var(--muted); font-size: .9rem; }

/* Each section of the dashboard is a panel with a titled header band. */
.panel { border: 1px solid var(--rule); border-radius: 10px; overflow: clip; min-width: 0; background: #ffffff; box-shadow: 0 2px 12px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05); }
.panel[hidden] { display: none; }
.panel > header {
  display: flex; flex-wrap: wrap; align-items: baseline; gap: .15rem 1rem;
  padding: .8rem 1.1rem; background: var(--band); border-bottom: 1px solid var(--rule);
}
.panel > header h2 { margin: 0; font-size: 1.05rem; font-weight: 700; }
.panel > header p { margin: 0; font-size: .85rem; color: var(--muted); flex: 1 1 14rem; }
.panel > header .tools { display: flex; gap: .9rem; font-size: .82rem; }
.linkbtn {
  font: inherit; color: var(--accent); background: none; border: 0; padding: 0;
  cursor: pointer; text-decoration: underline;
}
.panel .body { padding: 0 1.1rem 1rem; overflow-x: hidden; }

.columns { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.15fr) minmax(0, 1fr); gap: 1.25rem; margin-top: 1.25rem; align-items: start; }
.columns.single { grid-template-columns: minmax(0, 1fr) minmax(0, 56rem); }
@media (max-width: 55rem) { .columns { grid-template-columns: minmax(0, 1fr); } }

.controls {
  display: flex; flex-wrap: wrap; gap: .5rem .8rem; align-items: center;
  padding: .8rem 0; border-bottom: 1px solid var(--rule);
}
.chips { display: flex; gap: .35rem; flex-wrap: wrap; }
.chips label {
  display: inline-flex; align-items: center; gap: .4rem;
  padding: .2rem .6rem; border: 1px solid var(--rule); border-radius: 999px;
  font-size: .82rem; cursor: pointer; user-select: none; color: var(--muted);
}
.chips input { position: absolute; opacity: 0; pointer-events: none; }
.chips label:has(input:checked) { border-color: var(--ink); color: var(--ink); font-weight: 600; }
.chips label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: 2px; }
.chips .n { color: var(--muted); font-weight: 400; }
.chips .tick {
  width: .8rem; height: .8rem; border: 1.5px solid var(--muted); border-radius: 3px;
  display: inline-grid; place-items: center; font-size: .65rem; line-height: 1;
}
.chips label:has(input:checked) .tick { border-color: var(--ink); background: var(--ink); color: var(--bg); }
.chips label:has(input:checked) .tick::after { content: "✓"; }
select, input[type=search] {
  font: inherit; font-size: .82rem; color: var(--ink);
  background: #ffffff; border: 1px solid var(--rule); border-radius: 6px;
  padding: .28rem .5rem; max-width: 100%;
}
input[type=search] { flex: 1 1 9rem; min-width: 7rem; }
select:focus-visible, input[type=search]:focus-visible, a:focus-visible, button:focus-visible {
  outline: 2px solid var(--accent); outline-offset: 2px;
}

.box { display: inline-block; flex: none; width: .85rem; height: .85rem; border-radius: 3px; }
.box.high { background: var(--high); }
.box.medium { background: var(--medium); }
.box.low { background: var(--low); }
.box.ignored, .box.unscored { background: none; border: 1.5px dashed var(--low); }

/* Priority list */
#toplist a { color: var(--ink); text-decoration: none; font: 600 1rem/1.4 Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif; flex: 1; min-width: 0; }
#toplist a:hover { color: var(--accent); text-decoration: underline; }
#toplist li.read a { color: var(--muted); font-weight: 400; }

/* Day groups, collapsible */
.dayhead {
  display: flex; align-items: center; gap: .5rem; width: 100%;
  margin: 0; padding: .7rem 0 .45rem; background: none; border: 0; cursor: pointer;
  font: inherit; font-size: .88rem; font-weight: 700; color: var(--ink); text-align: left;
}
.dayhead::before { content: "▾"; color: var(--muted); width: .8rem; }
.dayhead[aria-expanded="false"]::before { content: "▸"; }
.dayhead .n { font-weight: 400; color: var(--muted); }
.day + .day { border-top: 1px solid var(--rule); }
.day ol, .day ul { list-style: none; margin: 0; padding: 0; }
.day [hidden] { display: none; }

/* Policy monitor items */
li.item {
  display: grid; grid-template-columns: .85rem 1fr; gap: .8rem;
  padding: .75rem 0; border-top: 1px solid var(--rule);
}
li.item > .box { margin-top: .35rem; }
.item h3 { margin: 0; font: 600 .93rem/1.35 Charter, "Bitstream Charter", "Sitka Text", Cambria, Georgia, serif; display: flex; align-items: baseline; gap: .4rem; }
.item h3 .bk-star { font-size: .85rem; font-weight: 400; margin-left: auto; flex: none; }
.item h3 a { color: var(--ink); text-decoration: none; }
.item h3 a:hover { color: var(--accent); text-decoration: underline; }
.item.medium h3, .item.low h3, .item.ignored h3 { font-weight: 400; }
.item.read h3 a, .item.read .summary { color: var(--muted); }
.item.read h3 { font-weight: 400; }
.item.read > .box { opacity: .35; }
.new {
  display: inline-block; margin-left: .4rem; padding: 0 .4rem; vertical-align: .1em;
  font: 600 .7rem/1.5 system-ui, sans-serif; color: var(--accent);
  border: 1px solid var(--accent); border-radius: 4px;
}
.summary { margin: .3rem 0 0; max-width: 44rem; font-size: .88rem; }
.meta {
  margin: .4rem 0 0; font-size: .8rem; color: var(--muted);
  display: flex; flex-wrap: wrap; align-items: center; gap: .15rem .8rem;
}
.tag { padding: .05rem .6rem; border-radius: 999px; background: var(--pill); color: var(--ink); font-size: .76rem; }
.body-tag { background: #dbeaf2; color: #0a3a52; }
.primary-src { font-size: .76rem; color: var(--accent); font-weight: 600; }
.more { margin-top: .35rem; font-size: .83rem; color: var(--muted); display: flex; flex-wrap: wrap; gap: .2rem 1rem; align-items: center; }
.more button { font: inherit; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; }
.more button::before { content: "▸ "; }
.more button[aria-expanded="true"]::before { content: "▾ "; }
.more a { color: var(--accent); }
.fold { flex-basis: 100%; }
.fold[hidden] { display: none; }
.fold p { margin: .3rem 0 0; max-width: 44rem; }
.fold p.en { color: var(--ink); font-size: .95rem; }

/* Government documents panel */
#gdlist { margin-top: .2rem; }
.gd-item { padding: .55rem 0; border-bottom: 1px solid var(--rule); }
.gd-item a { color: var(--ink); text-decoration: none; font-size: .93rem; line-height: 1.35; display: block; }
.gd-item a:hover { color: var(--accent); text-decoration: underline; }
.gd-meta { font-size: .75rem; color: var(--muted); margin-top: .15rem; display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }
.gd-agency { font-weight: 600; color: var(--ink); background: var(--band); border: 1px solid var(--rule); padding: .02rem .4rem; border-radius: 999px; font-size: .72rem; }
.gd-type { font-size: .72rem; color: var(--muted); background: var(--band); border: 1px solid var(--rule); padding: .02rem .4rem; border-radius: 999px; }
.gd-summ { font-size: .78rem; color: var(--muted); margin: .1rem 0 0; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.35; }
.gd-msg { font-size: .82rem; color: var(--muted); padding: .4rem 0; }
.gd-year { font-weight: 700; font-size: .88rem; padding: .5rem 0 .15rem; border-bottom: 2px solid var(--ink); margin-top: .5rem; color: var(--ink); }
.gd-year:first-child { margin-top: 0; }
.gd-meta .bk-star { margin-left: auto; }
.stick .controls { padding: .4rem 0; }

/* News alert items */
li.news { padding: .55rem 0; border-top: 1px solid var(--rule); display: flex; flex-wrap: wrap; align-items: baseline; gap: 0 .3rem; }
li.news > a { color: var(--ink); text-decoration: none; font-size: .93rem; line-height: 1.35; flex: 1; min-width: 0; }
li.news > a:hover { color: var(--accent); text-decoration: underline; }
li.news.read > a { color: var(--muted); }
li.news > .box { flex: none; }
li.news > .meta { flex-basis: 100%; margin-top: .15rem; }
li.news > .bk-star { flex: none; }

.empty { margin: 1rem 0 0; padding: 1rem; border: 1px dashed var(--rule); border-radius: 8px; color: var(--muted); font-size: .9rem; }

/* Highlights row: stats | highlights | bookmarks */
.top-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 1.25rem; margin-bottom: 1.25rem; align-items: start; }
@media (max-width: 70rem) { .top-row { display: block; } .top-side { display: none; } #top { max-width: 48rem; margin: 0 auto 1.25rem; } }
/* Side panels */
.side-h { font-size: .72rem; font-weight: 700; text-transform: uppercase; letter-spacing: .06em; color: var(--muted); margin: 0 0 .55rem; }
.stat-row { display: flex; align-items: center; gap: .45rem; padding: .12rem 0; }
.stat-n { font-weight: 700; font-size: .95rem; min-width: 1.8rem; color: var(--ink); }
.stat-lbl { font-size: .82rem; color: var(--muted); }
.stat-divider { border: 0; border-top: 1px solid var(--rule); margin: .4rem 0; }
.bk-item { display: flex; align-items: start; gap: .35rem; padding: .28rem 0; border-top: 1px solid var(--rule); }
.bk-item:first-child { border-top: 0; }
.bk-link { color: var(--ink); text-decoration: none; font-size: .82rem; line-height: 1.35; flex: 1; min-width: 0; }
.bk-link:hover { color: var(--accent); text-decoration: underline; }
.bk-rm { font: inherit; font-size: .8rem; color: var(--muted); background: none; border: 0; padding: 0 0 0 .1rem; cursor: pointer; flex: none; line-height: 1.5; }
.bk-rm:hover { color: var(--high); }
.bk-empty { font-size: .82rem; color: var(--muted); margin: 0; }
.bk-clear { display: block; margin-top: .6rem; font: inherit; font-size: .78rem; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; text-decoration: underline; }
.bk-clear:hover { color: var(--accent); }
/* Highlights box */
#toplist { margin: 0; padding: .7rem 1.1rem .9rem; list-style: none; }
#toplist li { margin: .5rem 0; }
.hi-prefix { display: block; font-size: .7rem; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin-bottom: .18rem; }
.hi-row { display: flex; align-items: baseline; gap: .3rem; }
.hi-row a { flex: 1; min-width: 0; }
.panel-count { font-size: .78rem; font-weight: 400; color: var(--muted); margin-left: .3rem; }
.bk-star { font: inherit; font-size: .9rem; background: none; border: 0; padding: 0; cursor: pointer; color: var(--muted); flex: none; line-height: 1.4; }
.bk-star:hover, .bk-star[aria-pressed="true"] { color: var(--medium); }

/* Scrollable panel bodies with sticky control bar */
.panel .body { overflow-y: auto; max-height: calc(100vh - 11rem); }
.stick { position: sticky; top: 0; background: #fff; z-index: 6; padding-bottom: .3rem; border-bottom: 1px solid var(--rule); margin-bottom: .2rem; }

/* Global search bar */
.gq-bar { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1rem; margin-bottom: 1.25rem; padding: .6rem 1.1rem; background: #fff; border: 1px solid var(--rule); border-radius: 10px; box-shadow: 0 2px 12px rgba(0,0,0,.07), 0 1px 3px rgba(0,0,0,.05); }
.gq-input { flex: 1; min-width: 12rem; }
.gq-chips { display: flex; flex-wrap: wrap; gap: .3rem; }
.gq-chip { font: inherit; font-size: .78rem; color: var(--accent); background: none; border: 1px solid var(--rule); border-radius: 999px; padding: .18rem .65rem; cursor: pointer; white-space: nowrap; }
.gq-chip:hover { border-color: var(--accent); }
.gq-chip.on { border-color: var(--accent); background: var(--accent); color: #fff; }

/* Pagination */
.pagination { display: flex; align-items: center; gap: .6rem; padding: .75rem 0 .5rem; font-size: .85rem; color: var(--muted); }
.pg-btn { font: inherit; font-size: .82rem; color: var(--accent); background: none; border: 1px solid var(--rule); border-radius: 6px; padding: .2rem .6rem; cursor: pointer; }
.pg-btn:disabled { color: var(--muted); opacity: .5; cursor: default; }
.pg-btn:not(:disabled):hover { background: var(--band); }

/* Multi-select dropdown */
.multisel { position: relative; }
.ms-btn {
  font: inherit; font-size: .82rem; color: var(--ink);
  background: #ffffff; border: 1px solid var(--rule); border-radius: 6px;
  padding: .28rem .6rem; cursor: pointer; display: inline-flex; align-items: center; gap: .35rem;
  white-space: nowrap;
}
.ms-btn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.ms-arrow { color: var(--muted); font-size: .75em; }
.ms-menu {
  position: absolute; top: calc(100% + 4px); left: 0; z-index: 20;
  background: #ffffff; border: 1px solid var(--rule); border-radius: 8px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
  min-width: 11rem; max-height: 20rem;
  display: flex; flex-direction: column;
}
.ms-menu[hidden] { display: none; }
.ms-items { overflow-y: auto; padding: .3rem 0; }
.ms-items label {
  display: flex; align-items: center; gap: .5rem;
  padding: .3rem .8rem; font-size: .85rem; cursor: pointer; white-space: nowrap;
}
.ms-items label:hover { background: var(--band); }
.ms-items input[type=checkbox] { accent-color: var(--accent); flex: none; }
.ms-footer { padding: .35rem .5rem .4rem; border-top: 1px solid var(--rule); flex: none; }
.ms-apply {
  display: block; width: 100%; padding: .3rem .6rem;
  font: inherit; font-size: .82rem; background: var(--accent); color: #fff;
  border: 0; border-radius: 6px; cursor: pointer; text-align: center;
}
.ms-apply:hover { opacity: .9; }
</style>
</head>
<body>
<div class="page">
  <header class="masthead">
    <h1>Germany monitor</h1>
    <p id="status"></p>
  </header>

  <div class="top-row">
    <div class="top-side" id="stats-side">
      <p class="side-h">Latest update</p>
      <div id="statslist"></div>
    </div>
    <section class="panel" id="top" hidden aria-labelledby="top-title">
      <header>
        <h2 id="top-title">Highlights</h2>
      </header>
      <ul id="toplist"></ul>
    </section>
    <div class="top-side" id="bookmarks-side">
      <p class="side-h">Saved items</p>
      <div id="bklist"><p class="bk-empty">No saved items.</p></div>
    </div>
  </div>

  <div class="gq-bar">
    <input type="search" id="gq" class="gq-input controls" placeholder="Search all panels…" aria-label="Search across all panels">
    <div class="gq-chips" role="group" aria-label="Quick searches">
      <button class="gq-chip" type="button">KRITIS</button>
      <button class="gq-chip" type="button">Zivilschutz</button>
      <button class="gq-chip" type="button">Blackout</button>
      <button class="gq-chip" type="button">Cyberangriff</button>
      <button class="gq-chip" type="button">Bundeswehr</button>
      <button class="gq-chip" type="button">Katastrophenschutz</button>
      <button class="gq-chip" type="button">Energie</button>
      <button class="gq-chip" type="button">Bundesamt</button>
    </div>
  </div>

  <div class="columns" id="columns">
    <section class="panel" id="govdocs" aria-labelledby="govdocs-title">
      <header>
        <h2 id="govdocs-title">Federal documents <span id="govdocs-count" class="panel-count"></span></h2>
        <span class="tools">
          <button type="button" class="linkbtn" id="gd-expand">Expand all</button>
          <button type="button" class="linkbtn" id="gd-collapse">Collapse all</button>
        </span>
      </header>
      <div class="body">
        <div class="stick">
          <div class="controls">
            <input type="search" id="gdq" placeholder="Search titles, summaries, agencies" aria-label="Search government documents">
          </div>
          <div class="controls">
            <div class="multisel" id="gd-agency-ms"></div>
            <div class="multisel" id="gd-type-ms"></div>
            <select id="gd-period" aria-label="Period">
              <option value="new">Latest update only</option>
              <option value="1">Last 24 hours</option>
              <option value="7">Last 7 days</option>
              <option value="all" selected>All</option>
            </select>
          </div>
        </div>
        <div id="gdlist"></div>
      </div>
    </section>

    <section class="panel" id="core" aria-labelledby="core-title">
      <header>
        <h2 id="core-title">Policy monitor <span id="core-count" class="panel-count"></span></h2>
        <span class="tools">
          <button type="button" class="linkbtn" data-days="core" data-open="1">Expand all</button>
          <button type="button" class="linkbtn" data-days="core" data-open="0">Collapse all</button>
        </span>
      </header>
      <div class="body">
        <div class="stick">
          <div class="controls">
            <input type="search" id="q" placeholder="Search headlines" aria-label="Search policy monitor headlines">
          </div>
          <div class="controls">
            <div class="multisel" id="tags-ms"></div>
            <select id="period" aria-label="Period">
              <option value="new">Latest update only</option>
              <option value="1">Last 24 hours</option>
              <option value="7" selected>Last 7 days</option>
              <option value="all">All</option>
            </select>
          </div>
          <div class="controls">
            <div class="chips" id="levels" role="group" aria-label="Levels to show"></div>
          </div>
        </div>
        <div id="list"></div>
      </div>
    </section>

    <section class="panel" id="news" hidden aria-labelledby="news-title">
      <header>
        <h2 id="news-title">News alerts <span id="news-count" class="panel-count"></span></h2>
        <span class="tools">
          <button type="button" class="linkbtn" data-days="news" data-open="1">Expand all</button>
          <button type="button" class="linkbtn" data-days="news" data-open="0">Collapse all</button>
        </span>
      </header>
      <div class="body">
        <div class="stick">
          <div class="controls">
            <input type="search" id="newsq" placeholder="Search headlines" aria-label="Search news alert headlines">
          </div>
          <div class="controls">
            <div class="multisel" id="newsalert-ms"></div>
            <select id="newsperiod" aria-label="Period">
              <option value="new">Latest update only</option>
              <option value="1">Last 24 hours</option>
              <option value="7">Last 7 days</option>
              <option value="all" selected>All</option>
            </select>
          </div>
          <div class="controls">
            <div class="chips" id="newschips" role="group" aria-label="News alert levels"></div>
          </div>
        </div>
        <div id="newslist"></div>
      </div>
    </section>

  // Google appends the publisher to titles (" - ESUT"); drop it when it matches the source.
  function tidy(title, source) {
    if (!title) return title;
    var plain = function (t) {
      return t.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
    };
    var host = plain(source || "").replace(/[^a-z0-9]/g, "");
    var generic = /^(news|nachrichten|aktuelles|meldungen|startseite|politik)$/i;
    for (var pass = 0; pass < 3; pass++) {
      var m = title.match(/^(.*\S)\s+[-–|]\s+([^-–|]{2,40})$/);
      if (!m) break;
      var tail = m[2].trim();
      var words = plain(tail).replace(/\.(de|com|org|net|eu|at|ch)\b/g, "").split(/[^a-z0-9]+/);
      var hit = words.some(function (w) { return w.length >= 2 && host.indexOf(w) !== -1; });
      if (!hit && !(pass > 0 && generic.test(tail))) break;
      title = m[1];
    }
    return title;
  }

  function translated(url) {

    var next = node("button", "pg-btn", "Next →");

    function getFiltered() {
      if (!allDocs) return [];
      var q         = gdq.value.trim().toLowerCase();
      var agencyVals = gdAgencyMs ? gdAgencyMs.getValues() : [];
      var typeVals   = gdTypeMs   ? gdTypeMs.getValues()   : [];
      var period    = gdPeriod ? gdPeriod.value : "all";
      var terms     = q ? q.split(/\s+/).filter(Boolean) : [];
      var from = "";
      if (period === "1") { var d1 = new Date(); d1.setDate(d1.getDate() - 1); from = d1.toISOString().slice(0, 10); }
      if (period === "7") { var d7 = new Date(); d7.setDate(d7.getDate() - 7); from = d7.toISOString().slice(0, 10); }
      return allDocs.filter(function (d) {
        if (agencyVals.length && agencyVals.indexOf(d.a) === -1) return false;
        if (typeVals.length && typeVals.indexOf(d.y || "") === -1) return false;
        if (period === "new" && (d.d || "").slice(0, 10) !== allDocsLatestDate) return false;
        if (from && (d.d || "") < from) return false;
        if (terms.length) {
          var hay = ((d.t || "") + " " + (d.s || "") + " " + (d.a || "")).toLowerCase();
          if (!terms.every(function (t) { return hay.indexOf(t) !== -1; })) return false;
        }
        return true;
      });
    }

    function renderDocs() {
      if (!allDocs) return;
      var docs = getFiltered();
      docs = docs.slice().sort(function (a, b) { return (a.d || "") < (b.d || "") ? 1 : -1; });
      if (gdCountEl) gdCountEl.textContent = "(" + docs.length.toLocaleString() + ")";
      gdList.textContent = "";
      if (!docs.length) { gdList.appendChild(node("p", "gd-msg", "No results.")); return; }

      var days = {}, dayOrder = [];
      docs.forEach(function (d) {
        var day = (d.d || "").slice(0, 10) || "Unknown";
        if (!days[day]) { days[day] = []; dayOrder.push(day); }
        days[day].push(d);
      });

      var lastYear = null;
      dayOrder.forEach(function (day, index) {
        var items = days[day];
        var dateObj = new Date(day + "T12:00:00Z");
        var year = isNaN(dateObj.getTime()) ? "" : String(dateObj.getUTCFullYear());
        if (year && year !== lastYear) {
          gdList.appendChild(node("div", "gd-year", year));
          lastYear = year;
        }
        var dateStr = isNaN(dateObj.getTime()) ? day
          : dateObj.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
        var open = gdDayOpen[day];
        if (open === undefined) open = true;

        var wrap = node("div", "day");
        var head = node("button", "dayhead");
        head.type = "button";
        head.setAttribute("aria-expanded", String(open));
        head.appendChild(document.createTextNode(dateStr + " "));
        head.appendChild(node("span", "n", "(" + items.length + ")"));

        var ul = document.createElement("ul");
        ul.style.cssText = "list-style:none;margin:0;padding:0;";
        ul.hidden = !open;
        items.forEach(function (d) {
          var li = document.createElement("li");
          var item = node("div", "gd-item");
          var a = node("a", "", d.t || d.u);
          a.href = translated(d.u); a.target = "_blank"; a.rel = "noopener noreferrer";
          a.title = "Open in Google Translate";
          item.appendChild(a);
          if (d.s) item.appendChild(node("p", "gd-summ", d.s));
          var meta = node("div", "gd-meta");
          if (d.a) { var chip = node("span", "gd-agency", agencyShort(d.a)); chip.title = d.a; meta.appendChild(chip); }
          if (d.y) meta.appendChild(node("span", "gd-type", d.y));
          var origA = node("a", "", "Original");
          origA.href = d.u; origA.target = "_blank"; origA.rel = "noopener noreferrer";
          origA.style.cssText = "font-size:.72rem;color:var(--accent);";
          meta.appendChild(origA);
          var gdBk = node("button", "bk-star", gdBookmarks[d.u] ? "★" : "☆");
          gdBk.type = "button"; gdBk.title = gdBookmarks[d.u] ? "Remove from saved" : "Save item";
          gdBk.setAttribute("aria-pressed", String(!!gdBookmarks[d.u]));
          gdBk.setAttribute("data-bkmk-gd", d.u);
          (function (url, title) {
            gdBk.addEventListener("click", function (e) { e.stopPropagation(); toggleGdBookmark(url, title); });
          }(d.u, d.t || ""));
          meta.appendChild(gdBk);
          item.appendChild(meta);
          li.appendChild(item);
          ul.appendChild(li);
        });
        head.addEventListener("click", function () {
          ul.hidden = !ul.hidden;
          gdDayOpen[day] = !ul.hidden;
          head.setAttribute("aria-expanded", String(!ul.hidden));
        });
        wrap.appendChild(head); wrap.appendChild(ul);
        gdList.appendChild(wrap);
      });
    }

    gdq.addEventListener("input", renderDocs);
    if (gdPeriod) gdPeriod.addEventListener("change", renderDocs);
    window.gdSetSearch = function (q) { gdq.value = q; renderDocs(); };

    var gdExpandBtn = el("gd-expand");
    var gdCollapseBtn = el("gd-collapse");
    if (gdExpandBtn) gdExpandBtn.addEventListener("click", function () {
      gdList.querySelectorAll(".day").forEach(function (wrap) {
        var head = wrap.querySelector(".dayhead");
        var list = wrap.querySelector("ul");
        if (head && list) {
          var key = head.textContent.trim();
          head.setAttribute("aria-expanded", "true"); list.hidden = false;
        }
      });
      Object.keys(gdDayOpen).forEach(function (k) { gdDayOpen[k] = true; });
    });
    if (gdCollapseBtn) gdCollapseBtn.addEventListener("click", function () {
      gdList.querySelectorAll(".day").forEach(function (wrap) {
        var head = wrap.querySelector(".dayhead");
        var list = wrap.querySelector("ul");
        if (head && list) { head.setAttribute("aria-expanded", "false"); list.hidden = true; }
      });
      Object.keys(gdDayOpen).forEach(function (k) { gdDayOpen[k] = false; });
    });

    gdList.appendChild(node("p", "gd-msg", "Loading…"));
    fetch("/govdocs/search.json")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (data) {
        allDocs = data;
        allDocsLatestDate = data.reduce(function (max, d) {
          return (d.d || "") > max ? (d.d || "").slice(0, 10) : max;
        }, "");
        var agencies = {}, types = {};
        data.forEach(function (d) { if (d.a) agencies[d.a] = true; if (d.y) types[d.y] = true; });
        var agencyItems = Object.keys(agencies).sort(function (x, y) {
          return agencyShort(x) < agencyShort(y) ? -1 : 1;
        }).map(function (a) { return { value: a, label: agencyShort(a) }; });
        var typeItems = Object.keys(types).sort().map(function (t) { return { value: t, label: t }; });
        if (agencyItems.length) gdAgencyMs = buildMultisel(el("gd-agency-ms"), "All agencies", agencyItems, renderDocs);
        if (typeItems.length) gdTypeMs = buildMultisel(el("gd-type-ms"), "All types", typeItems, renderDocs);
        renderDocs();
      })
      .catch(function () {
        gdList.textContent = "";
        gdList.appendChild(node("p", "gd-msg", "Documents not yet available."));
      });
  })();

  drawCore();

  // ---------- Global search
  (function () {
    var gq = el("gq");
    if (!gq) return;
    var activeChip = null;
    function applyGlobal(q) {
      var coreQ = el("q"); if (coreQ) { coreQ.value = q; corePage = 0; drawCore(); }
      var newsQ = el("newsq"); if (newsQ) { newsQ.value = q; newsPage = 0; drawNews(); }
      if (window.gdSetSearch) window.gdSetSearch(q);
    }
    gq.addEventListener("input", function () {
      if (activeChip) { activeChip.classList.remove("on"); activeChip = null; }
      applyGlobal(gq.value);
    });
    document.querySelectorAll(".gq-chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        var term = chip.textContent.trim();
        if (activeChip === chip) {
          chip.classList.remove("on"); activeChip = null; gq.value = ""; applyGlobal("");
        } else {
          if (activeChip) activeChip.classList.remove("on");
          chip.classList.add("on"); activeChip = chip; gq.value = term; applyGlobal(term);
        }
      });
    });
  })();
})();
</script>
</body>
</html>
