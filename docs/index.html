<style>

.chips input { position: absolute; opacity: 0; pointer-events: none; }

.chips .n { color: var(--muted); font-weight: 400; }
.chips .tick {

select, input[type=search] {

}

.box { display: inline-block; flex: none; width: .85rem; height: .85rem; border-radius: 3px; }
.box.high { background: var(--high); }
.box.medium { background: var(--medium); }
.box.low { background: var(--low); }

.item.read > .box { opacity: .35; }
.new {

.fold { flex-basis: 100%; }
.fold[hidden] { display: none; }
.fold p { margin: .3rem 0 0; max-width: 44rem; }
.fold p.en { color: var(--ink); font-size: .95rem; }

  var el = function (id) { return document.getElementById(id); };

  // Multi-select dropdown with Apply button: returns {getValues()}
  function buildMultisel(container, placeholder, items, onChange) {
    var btnLabel = node("span", "", placeholder);
    var btn = node("button", "ms-btn");
    btn.type = "button";
    btn.appendChild(btnLabel);
    btn.appendChild(node("span", "ms-arrow", " ▾"));
    var menu = node("div", "ms-menu");
    menu.hidden = true;
    var wrap = node("div", "ms-items");
    items.forEach(function (it) {
      var lbl = node("label");
      var cb = document.createElement("input");
      cb.type = "checkbox"; cb.value = it.value;
      cb.addEventListener("change", function () {
        var checked = [].slice.call(wrap.querySelectorAll("input:checked"));
        if (!checked.length) {
          btnLabel.textContent = placeholder;
        } else if (checked.length === 1) {
          var v = checked[0].value;
          for (var k = 0; k < items.length; k++) { if (items[k].value === v) { btnLabel.textContent = items[k].label; break; } }
        } else {
          btnLabel.textContent = checked.length + " selected";
        }
      });
      lbl.appendChild(cb);
      lbl.appendChild(document.createTextNode(it.label));
      wrap.appendChild(lbl);
    });
    var footer = node("div", "ms-footer");
    var applyBtn = node("button", "ms-apply", "Apply");
    applyBtn.type = "button";
    applyBtn.addEventListener("click", function (e) {
      e.stopPropagation();
      menu.hidden = true;
      onChange();
    });
    footer.appendChild(applyBtn);
    menu.appendChild(wrap);
    menu.appendChild(footer);
    menu.addEventListener("click", function (e) { e.stopPropagation(); });
    btn.addEventListener("click", function (e) {
      e.stopPropagation();
      document.querySelectorAll(".ms-menu").forEach(function (m) { if (m !== menu) m.hidden = true; });
      menu.hidden = !menu.hidden;
    });
    container.appendChild(btn);
    container.appendChild(menu);
    return {
      getValues: function () {
        return [].slice.call(wrap.querySelectorAll("input:checked")).map(function (cb) { return cb.value; });
      }
    };

  // Which items have been opened, remembered in this browser.

  }

  // Bookmarks remembered in this browser.
  var BKMK_KEY = "germany-monitor-bkmk";
  var bookmarks = {};
  try {
    (JSON.parse(localStorage.getItem(BKMK_KEY)) || []).forEach(function (id) { bookmarks[id] = true; });
  } catch (e) {}

  // Govdocs bookmarks: {url: title}
  var GD_BKMK_KEY = "germany-monitor-bkmk-gd";
  var gdBookmarks = {};
  try {
    var gbs = JSON.parse(localStorage.getItem(GD_BKMK_KEY));
    if (gbs && typeof gbs === "object" && !Array.isArray(gbs)) gdBookmarks = gbs;
  } catch (e) {}

  function toggleBookmark(id) {
    if (bookmarks[id]) { delete bookmarks[id]; } else { bookmarks[id] = true; }
    var keep = everything.filter(function (i) { return bookmarks[i.id]; }).map(function (i) { return i.id; });

      }
    });
  }
  function toggleGdBookmark(url, title) {

    try { localStorage.setItem(GD_BKMK_KEY, JSON.stringify(gdBookmarks)); } catch (e) {}
    drawBookmarks();
    document.querySelectorAll(".bk-star[data-bkmk-gd]").forEach(function (btn) {

  function drawBookmarks() {
    var bklist = el("bklist");

    bklist.textContent = "";
    var saved = everything.filter(function (i) { return bookmarks[i.id]; }).sort(newestFirst);
    var gdSaved = Object.keys(gdBookmarks);

    saved.forEach(function (i) {
      var row = node("div", "bk-item");
      var a = node("a", "bk-link", tidy(i.headline_en || i.title_de, i.source));
      a.href = i.lang === "en" ? i.url : translated(i.url);
      a.target = "_blank"; a.rel = "noopener noreferrer";
      var rm = node("button", "bk-rm", "✕");
      rm.type = "button"; rm.title = "Remove";
      rm.addEventListener("click", function () { toggleBookmark(i.id); });
      row.appendChild(a); row.appendChild(rm);
      bklist.appendChild(row);
    });
    gdSaved.forEach(function (url) {
      var row = node("div", "bk-item");
      var a = node("a", "bk-link", gdBookmarks[url] || url);
      a.href = url; a.target = "_blank"; a.rel = "noopener noreferrer";
      var rm = node("button", "bk-rm", "✕");
      rm.type = "button"; rm.title = "Remove";
      (function (u) { rm.addEventListener("click", function () { toggleGdBookmark(u, ""); }); }(url));
      row.appendChild(a); row.appendChild(rm);
      bklist.appendChild(row);
    });
    var clearBtn = node("button", "bk-clear", "Clear all");
    clearBtn.type = "button";
    clearBtn.addEventListener("click", function () {
      var ids = Object.keys(bookmarks);
      bookmarks = {}; gdBookmarks = {};
      try { localStorage.removeItem(BKMK_KEY); localStorage.removeItem(GD_BKMK_KEY); } catch (e) {}
      drawBookmarks();
      ids.forEach(function (id) {
        document.querySelectorAll(".bk-star[data-bkmk='" + id.replace(/'/g, "\\'") + "']").forEach(function (btn) {
          btn.textContent = "☆"; btn.setAttribute("aria-pressed", "false"); btn.title = "Save item";
        });
      });
      document.querySelectorAll(".bk-star[data-bkmk-gd]").forEach(function (btn) {
        btn.textContent = "☆"; btn.setAttribute("aria-pressed", "false"); btn.title = "Save item";
      });

  }
  function drawStats() {
    var statslist = el("statslist");
    if (!statslist) return;
    statslist.textContent = "";
    var newCore = items.filter(function (i) { return isNew[i.id]; });
    var newWider = wider.filter(function (i) { return isNew[i.id]; });
    var newH = newCore.filter(function (i) { return level(i) === "high"; }).length;
    var newM = newCore.filter(function (i) { return level(i) === "medium"; }).length;
    var newL = newCore.filter(function (i) { return level(i) === "low"; }).length;
    var newNA = newWider.filter(function (i) { return i.level === "high" || i.level === "medium"; }).length;
    if (!newH && !newM && !newL && !newNA) { statslist.appendChild(node("p", "bk-empty", "No new items.")); return; }
    function statRow(cls, n, lbl) {
      var row = node("div", "stat-row");
      if (cls) row.appendChild(node("span", "box " + cls));
      row.appendChild(node("span", "stat-n", String(n)));
      row.appendChild(node("span", "stat-lbl", lbl));
      return row;
    }
    if (newH) statslist.appendChild(statRow("high", newH, "High"));
    if (newM) statslist.appendChild(statRow("medium", newM, "Medium"));
    if (newL) statslist.appendChild(statRow("low", newL, "Low"));
    if (newNA) {
      statslist.appendChild(node("hr", "stat-divider"));
      statslist.appendChild(statRow("", newNA, "news alert" + (newNA === 1 ? "" : "s")));
    }
  }

  // Google appends the publisher to titles (" - ESUT"); drop it when it matches the source.
  function tidy(title, source) {
    if (!title) return title;
    var plain = function (t) {
      return t.toLowerCase().replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");
    };
    var host = plain(source || "").replace(/[^a-z0-9]/g, "");
    var generic = /^(news|nachrichten|aktuelles|meldungen|startseite|politik)$/i;
    for (var pass = 0; pass < 3; pass++) {
      var m = title.match(/^(.*\S)\s+[-–|]\s+([^-–|]{2,40})$/);
      if (!m) break;
      var tail = m[2].trim();
      var words = plain(tail).replace(/\.(de|com|org|net|eu|at|ch)\b/g, "").split(/[^a-z0-9]+/);
      var hit = words.some(function (w) { return w.length >= 2 && host.indexOf(w) !== -1; });
      if (!hit && !(pass > 0 && generic.test(tail))) break;
      title = m[1];
    }
    return title;
  }

  function translated(url) {
    return "https://translate.google.com/translate?sl=auto&tl=en&u=" + encodeURIComponent(url);
  }
  function headlineLink(i) {
    var a = node("a", "", tidy(i.headline_en || i.title_de, i.source));
    var english = i.lang === "en";
    a.href = english ? i.url : translated(i.url);
    a.target = "_blank"; a.rel = "noopener noreferrer";
    a.title = english ? "Open the page" : "Open the page translated into English";
    a.addEventListener("click", function () { markRead(i.id); });
    a.addEventListener("auxclick", function () { markRead(i.id); });
    return a;
  }
  function shortDate(iso) {
    var d = new Date(iso);
    return isNaN(d) ? "" : d.toLocaleDateString(undefined, { day: "numeric", month: "short" });
  }
  function newestFirst(a, b) {
    if (a.first_seen !== b.first_seen) return a.first_seen < b.first_seen ? 1 : -1;
    return a.published < b.published ? 1 : -1;
  }
  function inPeriod(i, period) {
    if (period === "all") return true;
    if (period === "new") return !!isNew[i.id];
    return new Date(i.first_seen).getTime() >= Date.now() - Number(period) * 864e5;
  }

  // Day groups that fold. The newest day starts open, older days start closed.
  var dayOpen = { core: {}, news: {} };
  var PAGE_DAYS = 7;
  var corePage = 0;
  var newsPage = 0;
  var newsLevelState = { high: true, medium: true, low: false, unscored: true };
  var NEWS_LEVEL_DEFS = [
    { key: "high", label: "High", on: true },
    { key: "medium", label: "Medium", on: true },
    { key: "low", label: "Low", on: false },
    { key: "unscored", label: "Not yet scored", on: true }
  ];
  function makePagination(totalDays, currentPage, onPage) {
    var totalPages = Math.ceil(totalDays / PAGE_DAYS);
    if (totalPages <= 1) return null;
    var wrap = node("div", "pagination");
    var prev = node("button", "pg-btn", "← Previous");
    prev.type = "button"; prev.disabled = currentPage === 0;
    prev.addEventListener("click", function () { onPage(currentPage - 1); });
    wrap.appendChild(prev);
    wrap.appendChild(node("span", "", "Page " + (currentPage + 1) + " of " + totalPages));
    var next = node("button", "pg-btn", "Next →");
    next.type = "button"; next.disabled = currentPage >= totalPages - 1;
    next.addEventListener("click", function () { onPage(currentPage + 1); });
    wrap.appendChild(next);
    return wrap;
  }
  function drawDays(panel, target, list, sorter, makeRow, listTag, pageStart, pageSize) {
    target.textContent = "";
    var days = {}, order = [];
    list.forEach(function (i) {
      var d = new Date(i.first_seen);
      var key = d.getFullYear() + "-" + (d.getMonth() + 1) + "-" + d.getDate();
      if (!days[key]) { days[key] = { date: d, items: [] }; order.push(key); }
      days[key].items.push(i);
    });
    order.sort(function (a, b) { return days[b].date - days[a].date; });
    dayKeys[panel] = order;
    var totalDays = order.length;
    var start = pageStart || 0;
    var slice = (pageSize != null) ? order.slice(start, start + pageSize) : order;
    slice.forEach(function (key, index) {
      var day = days[key];
      if (sorter) day.items.sort(sorter);
      var open = dayOpen[panel][key];
      if (open === undefined) open = start === 0 && index === 0;
      var wrap = node("div", "day");
      var head = node("button", "dayhead");
      head.type = "button";
      head.setAttribute("aria-expanded", String(open));
      head.appendChild(document.createTextNode(day.date.toLocaleDateString(undefined, {
        weekday: "long", day: "numeric", month: "long"
      }) + " "));
      head.appendChild(node("span", "n", "(" + day.items.length + ")"));
      var ol = node(listTag);
      ol.hidden = !open;
      day.items.forEach(function (i) { ol.appendChild(makeRow(i)); });
      head.addEventListener("click", function () {
        ol.hidden = !ol.hidden;
        dayOpen[panel][key] = !ol.hidden;
        head.setAttribute("aria-expanded", String(!ol.hidden));
      });
      wrap.appendChild(head);
      wrap.appendChild(ol);
      target.appendChild(wrap);
    });
    return totalDays;
  }
  var dayKeys = { core: [], news: [] };
  var tagsMs = null, alertMs = null;
  document.querySelectorAll("[data-days]").forEach(function (btn) {
    btn.addEventListener("click", function () {
      var panel = btn.getAttribute("data-days");
      var open = btn.getAttribute("data-open") === "1";
      dayKeys[panel].forEach(function (key) { dayOpen[panel][key] = open; });
      if (panel === "core") drawCore(); else drawNews();
    });
  });

  // Status line
  var status = el("status");
  if (data.generated) {
    var when = new Date(data.generated).toLocaleString(undefined, {
      weekday: "short", day: "numeric", month: "short", hour: "2-digit", minute: "2-digit"
    });
    status.textContent = "Updated " + when + ".";
  } else {
    status.textContent = "Not run yet.";
  }

  // ---------- Priority items (Highlights)
  (function () {
    var high = items.filter(function (i) { return level(i) === "high"; }).sort(newestFirst).slice(0, 15);
    var notable = wider.filter(function (i) { return i.level === "high"; }).sort(newestFirst).slice(0, 15);
    var combined = high.concat(notable).sort(newestFirst);
    if (!combined.length) return;
    // deduplicate by normalised headline
    var seen = {};
    combined = combined.filter(function (i) {
      var key = (i.headline_en || i.title_de || "").toLowerCase().replace(/[^a-z0-9]/g, "").slice(0, 60);
      if (!key || seen[key]) return false;
      seen[key] = true;
      return true;
    }).slice(0, 10);
    combined.forEach(function (i) {
      var li = node("li", read[i.id] ? "read" : "");
      li.setAttribute("data-id", i.id);
      var prefix = i.stream === "wider" ? "News alert" : "Policy monitor";
      li.appendChild(node("span", "hi-prefix", prefix));
      var row = node("div", "hi-row");
      if (i.stream === "wider" && i.level) {
        var dot = node("span", "box " + i.level);
        dot.title = { high: "High", medium: "Medium", low: "Low" }[i.level] || i.level;
        row.appendChild(dot);
      }
      row.appendChild(headlineLink(i));
      var bkBtn = node("button", "bk-star", bookmarks[i.id] ? "★" : "☆");
      bkBtn.type = "button";
      bkBtn.title = bookmarks[i.id] ? "Remove from saved" : "Save item";
      bkBtn.setAttribute("aria-pressed", String(!!bookmarks[i.id]));
      bkBtn.setAttribute("data-bkmk", i.id);
      (function (itemId) {
        bkBtn.addEventListener("click", function (e) { e.stopPropagation(); toggleBookmark(itemId); });
      }(i.id));
      row.appendChild(bkBtn);
      li.appendChild(row);
      el("toplist").appendChild(li);
    });
    el("top").hidden = false;
  })();
  drawStats();
  drawBookmarks();

  // ---------- Policy monitor
  var counts = {};
  items.forEach(function (i) { counts[level(i)] = (counts[level(i)] || 0) + 1; });
  LEVELS.forEach(function (s) {
    if ((s.key === "unscored" || s.key === "ignored") && !counts[s.key]) return;
    var label = node("label");
    var box = node("input");
    box.type = "checkbox"; box.value = s.key; box.checked = s.on;
    box.addEventListener("change", function () { corePage = 0; drawCore(); });
    label.appendChild(box);
    label.appendChild(node("span", "box " + s.key));
    label.appendChild(document.createTextNode(s.label + " "));

    el("levels").appendChild(label);
  });
  var tags = {};
  items.forEach(function (i) { if (i.tag) tags[i.tag] = true; });
  var tagItems = Object.keys(tags).sort().map(function (t) { return { value: t, label: t }; });
  if (tagItems.length) tagsMs = buildMultisel(el("tags-ms"), "All topics", tagItems, function () { corePage = 0; drawCore(); });
  el("period").addEventListener("change", function () { corePage = 0; drawCore(); });
  el("q").addEventListener("input", function () { corePage = 0; drawCore(); });

  function drawCore() {
    var shown = {};
    el("levels").querySelectorAll("input").forEach(function (b) { shown[b.value] = b.checked; });
    var tagVals = tagsMs ? tagsMs.getValues() : [];
    var period = el("period").value;
    var q = el("q").value.trim().toLowerCase();
    var visible = items.filter(function (i) {
      if (!shown[level(i)]) return false;
      if (tagVals.length && i.tag && tagVals.indexOf(i.tag) === -1) return false;
      if (!inPeriod(i, period)) return false;
      if (q) {
        var hay = [i.headline_en, i.summary_en, i.title_de, i.snippet_de, i.source].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    var coreCountEl = el("core-count");
    if (coreCountEl) coreCountEl.textContent = "(" + visible.length + ")";
    var list = el("list");
    if (!visible.length) {
      list.textContent = "";
      list.appendChild(node("p", "empty", items.length
        ? "Nothing matches these filters. Widen the period or tick more levels or topics."
        : "No items yet. Add feed addresses to feeds.txt, then run the update."));
      return;
    }
    var totalCoreDays = drawDays("core", list, visible, function (a, b) {
      return RANK[level(b)] - RANK[level(a)] || (a.published < b.published ? 1 : -1);
    }, coreRow, "ol", corePage * PAGE_DAYS, PAGE_DAYS);
    var corePg = makePagination(totalCoreDays, corePage, function (p) { corePage = p; drawCore(); });
    if (corePg) list.appendChild(corePg);
  }

  function coreRow(i) {
    var k = level(i);
    var li = node("li", "item " + k + (read[i.id] ? " read" : ""));
    li.setAttribute("data-id", i.id);
    var box = node("span", "box " + k);
    box.title = levelLabel(k);
    box.setAttribute("role", "img");
    box.setAttribute("aria-label", levelLabel(k));
    li.appendChild(box);

    var body = node("div");
    var h = node("h3");
    h.appendChild(headlineLink(i));
    if (isNew[i.id]) h.appendChild(node("span", "new", "new"));
    var hBk = node("button", "bk-star", bookmarks[i.id] ? "★" : "☆");
    hBk.type = "button"; hBk.title = bookmarks[i.id] ? "Remove from saved" : "Save item";
    hBk.setAttribute("aria-pressed", String(!!bookmarks[i.id]));
    hBk.setAttribute("data-bkmk", i.id);
    (function (id) { hBk.addEventListener("click", function (e) { e.stopPropagation(); toggleBookmark(id); }); }(i.id));
    h.appendChild(hBk);
    body.appendChild(h);

    // High items show their summary; the rest keep it folded away.
    var showSummary = k === "high" || k === "unscored";
    if (i.summary_en && showSummary) body.appendChild(node("p", "summary", i.summary_en));
    if (!i.headline_en && i.snippet_de) body.appendChild(node("p", "summary", i.snippet_de));

    var meta = node("p", "meta");
    if (i.tag) meta.appendChild(node("span", "tag", i.tag));
    if (i.body) meta.appendChild(node("span", "tag body-tag", i.body));
    meta.appendChild(node("span", "", i.source));
    var date = shortDate(i.published);
    if (date) meta.appendChild(node("span", "", date));
    if (i.source_type === "primary") meta.appendChild(node("span", "primary-src", "Primary source"));
    if (i.alerts && i.alerts.length) meta.appendChild(node("span", "", "Alert: " + i.alerts.join(", ")));
    body.appendChild(meta);

    // Fold-out with the German text, and the link to the untranslated page beside it.
    var more = node("div", "more");
    var orig = node("a", "", "Open original source");
    orig.href = i.url; orig.target = "_blank"; orig.rel = "noopener noreferrer";
    orig.addEventListener("click", function () { markRead(i.id); });

      fold.hidden = true;

      fold.appendChild(node("p", "", tidy(i.title_de, i.source)));
      if (i.snippet_de) fold.appendChild(node("p", "", i.snippet_de));

      btn.type = "button";
      btn.setAttribute("aria-expanded", "false");
      btn.addEventListener("click", function () {
        fold.hidden = !fold.hidden;
        btn.setAttribute("aria-expanded", String(!fold.hidden));
      });
      more.appendChild(btn);
      more.appendChild(orig);
      more.appendChild(fold);
    } else {
      more.appendChild(orig);
    }
    body.appendChild(more);
    li.appendChild(body);
    return li;
  }

  // ---------- News alerts: headlines from the general feeds, no scoring.
  function drawNews() {
    var alertVals = alertMs ? alertMs.getValues() : [];
    var period = el("newsperiod").value;
    var q = el("newsq").value.trim().toLowerCase();
    var visible = wider.filter(function (i) {
      if (!newsLevelState[i.level || "unscored"]) return false;
      if (alertVals.length && !alertVals.some(function (a) { return (i.alerts || []).indexOf(a) !== -1; })) return false;
      if (!inPeriod(i, period)) return false;
      if (q) {
        var hay = [i.headline_en, i.title_de, i.snippet_de, i.source].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }
      return true;
    });
    var newsCountEl = el("news-count");
    if (newsCountEl) newsCountEl.textContent = "(" + visible.length + ")";
    var list = el("newslist");
    if (!visible.length) {
      list.textContent = "";
      list.appendChild(node("p", "empty", "Nothing matches these filters. Choose another alert term or widen the period."));
      return;
    }
    var totalNewsDays = drawDays("news", list, visible, newestFirst, newsRow, "ul", newsPage * PAGE_DAYS, PAGE_DAYS);
    var newsPg = makePagination(totalNewsDays, newsPage, function (p) { newsPage = p; drawNews(); });
    if (newsPg) list.appendChild(newsPg);
  }
  function newsRow(i) {
    var lvl = i.level || "unscored";
    var li = node("li", "news " + lvl + (read[i.id] ? " read" : ""));
    li.setAttribute("data-id", i.id);
    if (i.level) {
      var dot = node("span", "box " + lvl);
      dot.title = { high: "High", medium: "Medium", low: "Low" }[lvl] || lvl;
      li.appendChild(dot);
    }
    li.appendChild(headlineLink(i));
    var nBk = node("button", "bk-star", bookmarks[i.id] ? "★" : "☆");
    nBk.type = "button"; nBk.title = bookmarks[i.id] ? "Remove from saved" : "Save item";
    nBk.setAttribute("aria-pressed", String(!!bookmarks[i.id]));
    nBk.setAttribute("data-bkmk", i.id);
    (function (id) { nBk.addEventListener("click", function (e) { e.stopPropagation(); toggleBookmark(id); }); }(i.id));
    li.appendChild(nBk);
    var meta = node("p", "meta");
    meta.appendChild(node("span", "", i.source));
    if (i.alerts && i.alerts.length) {
      i.alerts.forEach(function (a) { meta.appendChild(node("span", "tag", a)); });
    }
    li.appendChild(meta);
    if (i.title_de || i.snippet_de) {
      var more = node("div", "more");
      var fold = node("div", "fold");
      fold.hidden = true;
      if (i.snippet_de) fold.appendChild(node("p", "", i.snippet_de));
      else fold.appendChild(node("p", "", tidy(i.title_de, i.source)));
      var orig = node("a", "", "Open original source");
      orig.href = i.url; orig.target = "_blank"; orig.rel = "noopener noreferrer";
      orig.addEventListener("click", function () { markRead(i.id); });
      var btn = node("button", "", "German summary");
      btn.type = "button";
      btn.setAttribute("aria-expanded", "false");
      btn.addEventListener("click", function () {
        fold.hidden = !fold.hidden;
        btn.setAttribute("aria-expanded", String(!fold.hidden));
      });
      more.appendChild(btn);
      more.appendChild(orig);
      more.appendChild(fold);
      li.appendChild(more);
    }
    return li;
  }
  if (wider.length) {
    var labels = {};
    wider.forEach(function (i) { (i.alerts || []).forEach(function (a) { labels[a] = (labels[a] || 0) + 1; }); });
    var alertItems = Object.keys(labels).sort().map(function (a) {
      return { value: a, label: a.replace(/\s*\([^)]*\)\s*/g, "").trim() || a };
    });
    if (alertItems.length) alertMs = buildMultisel(el("newsalert-ms"), "All alert terms", alertItems, function () { newsPage = 0; drawNews(); });
    var newsCounts = {};
    wider.forEach(function (i) { var k = i.level || "unscored"; newsCounts[k] = (newsCounts[k] || 0) + 1; });
    var hasLevels = wider.some(function (i) { return i.level; });
    if (hasLevels) {
      NEWS_LEVEL_DEFS.forEach(function (s) {
        if (s.key === "unscored" && !newsCounts.unscored) return;
        var lbl = node("label");
        var cb = document.createElement("input");
        cb.type = "checkbox"; cb.checked = newsLevelState[s.key];
        cb.addEventListener("change", function () { newsLevelState[s.key] = cb.checked; newsPage = 0; drawNews(); });
        lbl.appendChild(cb);
        lbl.appendChild(node("span", "box " + s.key));
        lbl.appendChild(document.createTextNode(" " + s.label + " "));
        lbl.appendChild(node("span", "n", String(newsCounts[s.key] || 0)));
        el("newschips").appendChild(lbl);
      });
    }
    el("newsperiod").addEventListener("change", function () { newsPage = 0; drawNews(); });
    el("newsq").addEventListener("input", function () { newsPage = 0; drawNews(); });
    el("news").hidden = false;
    drawNews();
  } else {
    el("columns").classList.add("single");
  }

  // ---------- Federal documents
  (function () {
    var allDocs = null;
    var allDocsLatestDate = "";
    var gdDayOpen = {};
    var gdAgencyMs = null, gdTypeMs = null;

    var gdq      = el("gdq");
    var gdPeriod = el("gd-period");
    var gdCountEl = el("govdocs-count");
    var gdList   = el("gdlist");

    function agencyShort(agency) {
      var m = agency && agency.match(/\(([A-Z]{2,})\)$/);
      return m ? m[1] : (agency || "").split(/,\s*/)[0].trim().slice(0, 25);
    }

    function getFiltered() {
      if (!allDocs) return [];
      var q         = gdq.value.trim().toLowerCase();
      var agencyVals = gdAgencyMs ? gdAgencyMs.getValues() : [];
      var typeVals   = gdTypeMs   ? gdTypeMs.getValues()   : [];
      var period    = gdPeriod ? gdPeriod.value : "all";
      var terms     = q ? q.split(/\s+/).filter(Boolean) : [];
      var from = "";
      if (period === "1") { var d1 = new Date(); d1.setDate(d1.getDate() - 1); from = d1.toISOString().slice(0, 10); }
      if (period === "7") { var d7 = new Date(); d7.setDate(d7.getDate() - 7); from = d7.toISOString().slice(0, 10); }
      return allDocs.filter(function (d) {
        if (agencyVals.length && agencyVals.indexOf(d.a) === -1) return false;
        if (typeVals.length && typeVals.indexOf(d.y || "") === -1) return false;
        if (period === "new" && (d.d || "").slice(0, 10) !== allDocsLatestDate) return false;
        if (from && (d.d || "") < from) return false;
        if (terms.length) {
          var hay = ((d.t || "") + " " + (d.s || "") + " " + (d.a || "")).toLowerCase();
          if (!terms.every(function (t) { return hay.indexOf(t) !== -1; })) return false;
        }
        return true;
      });
    }

    function renderDocs() {
      if (!allDocs) return;
      var docs = getFiltered();
      docs = docs.slice().sort(function (a, b) { return (a.d || "") < (b.d || "") ? 1 : -1; });
      if (gdCountEl) gdCountEl.textContent = "(" + docs.length.toLocaleString() + ")";
      gdList.textContent = "";
      if (!docs.length) { gdList.appendChild(node("p", "gd-msg", "No results.")); return; }

      var days = {}, dayOrder = [];
      docs.forEach(function (d) {
        var day = (d.d || "").slice(0, 10) || "Unknown";
        if (!days[day]) { days[day] = []; dayOrder.push(day); }
        days[day].push(d);
      });

      var lastYear = null;
      dayOrder.forEach(function (day, index) {
        var items = days[day];
        var dateObj = new Date(day + "T12:00:00Z");
        var year = isNaN(dateObj.getTime()) ? "" : String(dateObj.getUTCFullYear());
        if (year && year !== lastYear) {
          gdList.appendChild(node("div", "gd-year", year));
          lastYear = year;
        }
        var dateStr = isNaN(dateObj.getTime()) ? day
          : dateObj.toLocaleDateString("en-GB", { weekday: "long", day: "numeric", month: "long", timeZone: "UTC" });
        var open = gdDayOpen[day];
        if (open === undefined) open = true;

        var wrap = node("div", "day");
        var head = node("button", "dayhead");
        head.type = "button";
        head.setAttribute("aria-expanded", String(open));
        head.appendChild(document.createTextNode(dateStr + " "));
        head.appendChild(node("span", "n", "(" + items.length + ")"));

        var ul = document.createElement("ul");
        ul.style.cssText = "list-style:none;margin:0;padding:0;";
        ul.hidden = !open;
        items.forEach(function (d) {
          var li = document.createElement("li");
          var item = node("div", "gd-item");
          var a = node("a", "", d.t || d.u);
          a.href = translated(d.u); a.target = "_blank"; a.rel = "noopener noreferrer";
          a.title = "Open in Google Translate";
          item.appendChild(a);
          if (d.s) item.appendChild(node("p", "gd-summ", d.s));
          var meta = node("div", "gd-meta");
          if (d.a) { var chip = node("span", "gd-agency", agencyShort(d.a)); chip.title = d.a; meta.appendChild(chip); }
          if (d.y) meta.appendChild(node("span", "gd-type", d.y));
          var origA = node("a", "", "Original");
          origA.href = d.u; origA.target = "_blank"; origA.rel = "noopener noreferrer";
          origA.style.cssText = "font-size:.72rem;color:var(--accent);";
          meta.appendChild(origA);
          var gdBk = node("button", "bk-star", gdBookmarks[d.u] ? "★" : "☆");
          gdBk.type = "button"; gdBk.title = gdBookmarks[d.u] ? "Remove from saved" : "Save item";
          gdBk.setAttribute("aria-pressed", String(!!gdBookmarks[d.u]));
          gdBk.setAttribute("data-bkmk-gd", d.u);
          (function (url, title) {
            gdBk.addEventListener("click", function (e) { e.stopPropagation(); toggleGdBookmark(url, title); });
          }(d.u, d.t || ""));
          meta.appendChild(gdBk);
          item.appendChild(meta);
          li.appendChild(item);
          ul.appendChild(li);
        });
        head.addEventListener("click", function () {
          ul.hidden = !ul.hidden;
          gdDayOpen[day] = !ul.hidden;
          head.setAttribute("aria-expanded", String(!ul.hidden));
        });
        wrap.appendChild(head); wrap.appendChild(ul);
        gdList.appendChild(wrap);
      });
    }

    gdq.addEventListener("input", renderDocs);
    if (gdPeriod) gdPeriod.addEventListener("change", renderDocs);
    window.gdSetSearch = function (q) { gdq.value = q; renderDocs(); };

    var gdExpandBtn = el("gd-expand");
    var gdCollapseBtn = el("gd-collapse");
    if (gdExpandBtn) gdExpandBtn.addEventListener("click", function () {
      gdList.querySelectorAll(".day").forEach(function (wrap) {
        var head = wrap.querySelector(".dayhead");
        var list = wrap.querySelector("ul");
        if (head && list) {
          var key = head.textContent.trim();
          head.setAttribute("aria-expanded", "true"); list.hidden = false;
        }
      });
      Object.keys(gdDayOpen).forEach(function (k) { gdDayOpen[k] = true; });
    });
    if (gdCollapseBtn) gdCollapseBtn.addEventListener("click", function () {
      gdList.querySelectorAll(".day").forEach(function (wrap) {
        var head = wrap.querySelector(".dayhead");
        var list = wrap.querySelector("ul");
        if (head && list) { head.setAttribute("aria-expanded", "false"); list.hidden = true; }
      });
      Object.keys(gdDayOpen).forEach(function (k) { gdDayOpen[k] = false; });
    });

    gdList.appendChild(node("p", "gd-msg", "Loading…"));
    fetch("/govdocs/search.json")
      .then(function (r) { return r.ok ? r.json() : Promise.reject(r.status); })
      .then(function (data) {
        allDocs = data;
        allDocsLatestDate = data.reduce(function (max, d) {
          return (d.d || "") > max ? (d.d || "").slice(0, 10) : max;
        }, "");
        var agencies = {}, types = {};
        data.forEach(function (d) { if (d.a) agencies[d.a] = true; if (d.y) types[d.y] = true; });
        var agencyItems = Object.keys(agencies).sort(function (x, y) {
          return agencyShort(x) < agencyShort(y) ? -1 : 1;
        }).map(function (a) { return { value: a, label: agencyShort(a) }; });
        var typeItems = Object.keys(types).sort().map(function (t) { return { value: t, label: t }; });
        if (agencyItems.length) gdAgencyMs = buildMultisel(el("gd-agency-ms"), "All agencies", agencyItems, renderDocs);
        if (typeItems.length) gdTypeMs = buildMultisel(el("gd-type-ms"), "All types", typeItems, renderDocs);
        renderDocs();
      })
      .catch(function () {
        gdList.textContent = "";
        gdList.appendChild(node("p", "gd-msg", "Documents not yet available."));
      });
  })();

  drawCore();

  // ---------- Global search
  (function () {
    var gq = el("gq");
    if (!gq) return;
    var activeChip = null;
    function applyGlobal(q) {
      var coreQ = el("q"); if (coreQ) { coreQ.value = q; corePage = 0; drawCore(); }
      var newsQ = el("newsq"); if (newsQ) { newsQ.value = q; newsPage = 0; drawNews(); }
      if (window.gdSetSearch) window.gdSetSearch(q);
    }
    gq.addEventListener("input", function () {
      if (activeChip) { activeChip.classList.remove("on"); activeChip = null; }
      applyGlobal(gq.value);
    });
    document.querySelectorAll(".gq-chip").forEach(function (chip) {
      chip.addEventListener("click", function () {
        var term = chip.textContent.trim();
        if (activeChip === chip) {
          chip.classList.remove("on"); activeChip = null; gq.value = ""; applyGlobal("");
        } else {
          if (activeChip) activeChip.classList.remove("on");
          chip.classList.add("on"); activeChip = chip; gq.value = term; applyGlobal(term);
        }
      });
    });
  })();
})();
</script>
</body>
</html>
